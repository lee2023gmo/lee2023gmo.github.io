baseURL = 'https://lee2023gmo.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'lc的秘密基地'
theme = 'PaperMod'
enableGitInfo = true
hasCJKLanguage = true

[frontmatter]
  lastmod = [':git', 'lastmod', ':fileModTime', 'date', 'publishDate']

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = '记录思考'
  defaultTheme = 'auto'   # 跟随系统的明暗模式
  ShowReadingTime = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowLastMod = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true

  [params.homeInfoParams]
    Title = '你好，欢迎来到我的博客'
    Content = '这里记录深度学习、论文阅读与实践中的思考。可以从「学习路线」开始浏览。'

[[menu.main]]
  name = '首页'
  url = '/'
  weight = 10

[[menu.main]]
  name = '学习路线'
  url = '/roadmap/'
  weight = 20

[[menu.main]]
  name = '搜索'
  url = '/search/'
  weight = 30

[[menu.main]]
  name = '归档'
  url = '/archives/'
  weight = 40

[[menu.main]]
  name = '标签'
  url = '/tags/'
  weight = 50

[[menu.main]]
  name = '分类'
  url = '/categories/'
  weight = 60

[[menu.main]]
  name = '关于'
  url = '/about/'
  weight = 70

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
